user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /dev/stderr;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    # The site is served through Cloudflare: take the client IP from CF-Connecting-IP,
    # but only when the request comes from a Cloudflare edge (https://www.cloudflare.com/ips/).
    real_ip_header CF-Connecting-IP;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15;
    types_hash_max_size 2048;
    client_max_body_size 500M;
    include /etc/nginx/include/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types
        text/css
        text/xml
        text/plain
        image/svg+xml
        application/javascript
        application/json
        application/atom+xml
        application/rss+xml
        application/xhtml+xml
        application/msword
        application/pdf
        application/rtf;

    # TLS session settings shared by all HTTPS servers (per-server settings: include/ssl.conf).
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    log_format apm '"$time_local '
                   'client=$remote_addr '
                   'request_method=$request_method '
                   'host=$host '
                   'request=$request_uri '
                   'reffer=$http_referer '
                   'request_length=$request_length '
                   'status=$status '
                   'bytes_sent=$bytes_sent '
                   'body_bytes_sent=$body_bytes_sent '
                   'upstream_addr=$upstream_addr '
                   'upstream_status=$upstream_status '
                   'request_time=$request_time '
                   'upstream_response_time=$upstream_response_time '
                   'upstream_connect_time=$upstream_connect_time '
                   'upstream_header_time=$upstream_header_time '
                   'user_agent="$http_user_agent" ';

    add_header X-Infra-Hostname $hostname;

    include /etc/nginx/include/map.conf;
    include /etc/nginx/conf.d/*.conf;

    open_file_cache max=100;
}
