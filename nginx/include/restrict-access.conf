# Access list for admin-only hosts (Bitcart, MinIO console, Hangfire job server).
# Only private/loopback addresses are allowed by default; add the public IPs of your
# office/VPN below (with Cloudflare in front, $remote_addr is the real client IP).
allow 127.0.0.1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
# allow 203.0.113.10; # example: VPN exit IP
deny all;
