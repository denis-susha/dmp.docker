# X-Robots-Tag value for the storefront:
#   - non-production hosts (loc.*, dev*.*, stage*.*) are never indexed;
#   - tag pages and paginated listings are "noindex, follow".
# An empty value means the header is not sent.
map $host $robots_host {
    default "";
    "~^(loc|dev\d*|stage[^.]*)\." "noindex, nofollow";
}

map $uri $robots_uri {
    default "";
    "~^/tags/" "noindex, follow";
}

map $arg_page $robots_page {
    default "noindex, follow";
    "" "";
    "0" "";
}

map "$robots_host|$robots_uri|$robots_page" $robots_tag {
    default "";
    "~noindex, nofollow" "noindex, nofollow";
    "~noindex, follow" "noindex, follow";
}
